services:
  backend:
    build:
      context: ./backend/
      dockerfile: ./Dockerfile
      target: develop
    volumes:
      - ./backend:/opt/blackledger
      - cargo-cache:/usr/local/cargo/registry
      - target-cache:/opt/blackledger/target
    ports:
      - "8001:8000"
    environment:
      AUTH_ENABLED: "false"
      DATABASE_URL: postgresql://postgres:password@postgres-backend:5432/blackledger
      PORT: "8000"
      RUST_LOG: blackledger=debug,tower_http=debug,sqlx=warn
    depends_on:
      - postgres-backend

  postgres-backend:
    image: postgres:16
    environment:
      POSTGRES_DB: blackledger
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"
    volumes:
      - pgdata-backend:/var/lib/postgresql/data

  postgres-test:
    image: postgres:16
    environment:
      POSTGRES_DB: blackledger_test
      POSTGRES_USER: blackledger_test
      POSTGRES_PASSWORD: test
    ports:
      - "5434:5432"
    volumes:
      - pgdata-test:/var/lib/postgresql/data

  app:
    depends_on:
      - postgres-app
    build:
      context: ./
      dockerfile: ./Dockerfile
      target: develop
      # Use the following to test performance
      # target: test
    volumes:
      - .:/opt/blackledger
    ports:
      - "8000:8000"
    environment:
      DEBUG: "True"
      AUTH_DISABLED: "True"
      AUTH_JWKS_URL: http://keycloak:8001/realms/blackledger/protocol/openid-connect/certs
      AUTH_ISSUER: http://localhost:8001/realms/blackledger
      DATABASE_NAME: blackledger
      DATABASE_URL: postgresql://postgres:password@postgres-app:5432/blackledger
      DATABASE_DIALECT: psycopg

  app-migrate:
    depends_on:
      - postgres-app
      - app
    image: blackledger-app
    entrypoint: [ "script/migrate.sh" ]
    volumes:
      - .:/opt/blackledger
    environment:
      DATABASE_URL: postgresql://postgres:password@postgres-app:5432/blackledger
      DATABASE_DIALECT: psycopg

  postgres-app:
    image: postgres:16
    environment:
      POSTGRES_DB: blackledger
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - pgdata-app:/var/lib/postgresql/data
      - .:/opt/blackledger
  # keycloak:
  #   image: quay.io/keycloak/keycloak:22.0.5
  #   depends_on:
  #     - postgres-app
  #   environment:
  #     KEYCLOAK_ADMIN: admin
  #     KEYCLOAK_ADMIN_PASSWORD: admin
  #     KC_DB: postgres
  #     KC_DB_URL_HOST: postgres
  #     KC_DB_URL_PORT: 5432
  #     KC_DB_URL_DATABASE: keycloak
  #     KC_DB_USERNAME: postgres
  #     KC_DB_PASSWORD: password
  #     KC_HTTP_PORT: "8001"
  #     KC_HEALTH_ENABLED: true
  #     KC_METRICS_ENABLED: true
  #   command: [ "start-dev" ]
  #   ports:
  #     - "8001:8001"
  #   restart: on-failure

volumes:
  pgdata-app:
  pgdata-backend:
  pgdata-test:
  cargo-cache:
  target-cache:
