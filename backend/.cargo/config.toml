# Cargo configuration with useful aliases

[alias]
# Run tests with coverage using cargo-tarpaulin
coverage = "tarpaulin --config tarpaulin.toml"
coverage-html = "tarpaulin --out Html"
coverage-lcov = "tarpaulin --out Lcov"

# Quick coverage with minimal output
cov = "tarpaulin --print-summary"

# Run specific test with coverage
coverage-test = "tarpaulin --test"

# Watch for changes and re-run tests
watch-test = "watch -x test"

# Check code without running tests
check-all = "check --all-targets --all-features"