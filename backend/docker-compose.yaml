services:
  backend:
    build:
      context: ./
      dockerfile: ./Dockerfile
      target: develop
    volumes:
      - .:/opt/blackledger
      - cargo-cache:/usr/local/cargo/registry
      - target-cache:/opt/blackledger/target
    ports:
      - "8000:8000"
    environment:
      AUTH_ENABLED: "false"
      DATABASE_URL: postgresql://postgres:password@postgres:5432/blackledger
      PORT: "8000"
      RUST_LOG: blackledger=debug,tower_http=debug,sqlx=warn
    depends_on:
      - postgres

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: blackledger
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_PORT: 5432
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  postgres-test:
    image: postgres:16
    environment:
      POSTGRES_DB: blackledger_test
      POSTGRES_USER: blackledger_test
      POSTGRES_PASSWORD: test
      POSTGRES_PORT: 5432
    ports:
      - "5434:5432"
    volumes:
      - pgdata-test:/var/lib/postgresql/data

volumes:
  pgdata:
  pgdata-test:
  cargo-cache:
  target-cache:
